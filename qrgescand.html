<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U wordt doorgestuurd naar onze homepage...</title>
  <link rel="icon" href="logo.png" type="image/png" sizes="32x32">
  <!-- Font Awesome (zelfde als homepage) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f9fd;
      color: #1a3636;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
    }

    /* De container is exact dezelfde stijl als de originele .container */
    .qr-container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 20px 35px -8px rgba(0, 65, 80, 0.15);
      padding: 2.5rem 2.5rem;
      border: none;
    }

    /* header-flex exact gekopieerd van de originele homepage */
    .header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .logo-blok {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .logo-img {
      width: 120px;
      height: auto;
      display: block;
    }

    .logo-blok h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #0a4b5c;
    }

    /* intro-box exact zoals homepage */
    .intro-box {
      background: #f9fdfe;
      border-radius: 2rem;
      padding: 2rem 2.2rem;
      margin: 1.5rem 0 2rem;
      border: 1px solid #daeef7;
      box-shadow: 0 8px 18px -8px rgba(0,80,100,0.1);
      text-align: center;
    }

    .intro-box p {
      font-size: 1.8rem;
      max-width: 850px;
      margin: 0 auto;
    }

    /* De doorstuurregel – zelfde stijl maar eigen variant */
    .doorstuur-bericht {
      background: #eef6fb;
      border-radius: 2.5rem;
      padding: 2.2rem 2rem;
      margin: 2rem 0 2.2rem;
      border: 2px solid #b2d5ea;
      text-align: center;
    }

    .doorstuur-tekst {
      font-size: 2rem;
      font-weight: 500;
      color: #024353;
      margin-bottom: 1rem;
    }

    .doorstuur-tekst i {
      color: #1d7d94;
      margin-right: 0.5rem;
    }

    /* Vaste puntjes */
    .vaste-puntjes {
      font-size: 2rem;
      font-weight: 500;
      color: #024353;
      display: inline;
    }

    /* laadanimatie */
    .laad-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1.8rem 0 0.8rem;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 5px solid #d0e2ed;
      border-top: 5px solid #0b5e74;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .seconden-teller {
      font-size: 2.2rem;
      font-weight: 600;
      background: #115f72;
      color: white;
      display: inline-block;
      padding: 0.4rem 1.8rem;
      border-radius: 60px;
      margin-left: 0.5rem;
    }

    .onder-teller {
      font-size: 1.2rem;
      color: #2d5d6e;
      margin-top: 0.8rem;
    }

    /* verborgen class */
    .hidden {
      display: none;
    }

    /* footer exact zoals homepage - maar zonder regio tekst */
    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: #436d7a;
      border-top: 1px solid #cde1ec;
      padding-top: 2rem;
    }

    .nu-doorgaan {
      background: #c6e2f0;
      border-radius: 60px;
      padding: 1rem 2rem;
      font-size: 1.6rem;
      color: #024353;
      margin: 2rem 0;
      text-align: center;
    }
  </style>
</head>
<body>
<div class="qr-container">
  <!-- HEADER – alleen logo en titel, geen regio tag meer -->
  <div class="header-flex">
    <div class="logo-blok">
      <img src="logo.png" alt="Drone aan Huis Logo" class="logo-img" onerror="this.style.display='none'">
      <h1>Drone aan Huis</h1>
    </div>
  </div>

  <!-- intro-box met bedankt tekst -->
  <div class="intro-box">
    <p>
      <i class="fas fa-qrcode" style="color:#0b5e74;"></i> 
      Bedankt voor het scannen van de QR-code.
    </p>
  </div>

  <!-- Doorstuurbericht met vaste puntjes -->
  <div id="doorstuurBlok" class="doorstuur-bericht">
    <div class="doorstuur-tekst">
      <i class="fas fa-arrow-circle-right"></i> 
      U wordt doorgestuurd naar onze homepage...
    </div>
    
    <!-- laadwrapper met spinner en teller -->
    <div class="laad-wrapper">
      <div class="spinner"></div>
      <span id="teller" class="seconden-teller">5</span>
    </div>
    <div class="onder-teller">
      Even geduld...
    </div>
  </div>

  <!-- Dit blok verschijnt wanneer de teller op 0 staat -->
  <div id="nuDoorgaanMelding" class="nu-doorgaan hidden">
    <i class="fas fa-check-circle" style="color:#1d7d94;"></i> 
    U wordt nu doorgestuurd.
  </div>

  <!-- footer zonder regio vermelding -->
  <footer>
    <p>Drone aan Huis – Jim Schellekens</p>
  </footer>
</div>

<script>
  (function() {
    // DOORSTUUR LOGICA
    const DOORSTUUR_SECONDEN = 5;
    const DOORSTUUR_URL = 'https://droneaanhuis.jimschellekens.nl';

    const tellerSpan = document.getElementById('teller');
    const doorstuurBlok = document.getElementById('doorstuurBlok');
    const nuDoorgaanMelding = document.getElementById('nuDoorgaanMelding');

    let seconden = DOORSTUUR_SECONDEN;
    tellerSpan.textContent = seconden;

    const countdown = setInterval(() => {
      seconden -= 1;
      tellerSpan.textContent = seconden;

      if (seconden <= 0) {
        clearInterval(countdown);
        
        doorstuurBlok.classList.add('hidden');
        nuDoorgaanMelding.classList.remove('hidden');
        
        window.location.href = DOORSTUUR_URL;
      }
    }, 1000);
  })();
</script>
</body>
</html>
